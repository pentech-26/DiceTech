<!DOCTYPE html>
<html lang="es" data-tema="noche">
<head>
<meta charset="utf-8">
<title>DiceTech</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1614">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DiceTech">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:'Cinzel';font-weight:700;font-display:swap;src:url(fonts/cinzel-700.woff2) format('woff2')}
@font-face{font-family:'IM Fell English SC';font-weight:400;font-display:swap;src:url(fonts/imfell-sc.woff2) format('woff2')}

:root{
  --fondo:#0d1614; --panel:#15231f; --panel2:#1c2f29; --borde:#2c463d;
  --tinta:#ece4cf; --tenue:#9fb0a4; --oro:#d2ad63; --oro2:#a8843f; --sobreOro:#1b1407;
  --tapete1:#245443; --tapete2:#0f2a21; --marco:#3a2616; --marco2:#1f140b;
  --critico:#f0c75e; --especial:#5fd3b3; --exito:#7fcf7a; --fallo:#b9a79a; --pifia:#ef6a5b;
}
html[data-tema="dia"]{
  --fondo:#ece3cf; --panel:#faf5e7; --panel2:#f1e9d6; --borde:#d3c6a8;
  --tinta:#27251d; --tenue:#6d6a58; --oro:#8a6420; --oro2:#6d4e15; --sobreOro:#fff8e6;
  --critico:#a8760a; --especial:#12806a; --exito:#2e7d32; --fallo:#77695e; --pifia:#c0392b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--fondo);color:var(--tinta);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
svg{display:block}

#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top)) 14px 8px}

/* Cabecera */
header{position:relative;display:flex;align-items:center;justify-content:space-between;height:48px;flex:none}
h1{margin:0;position:absolute;left:0;right:0;text-align:center;pointer-events:none;
  font:400 30px/1 'IM Fell English SC',Georgia,serif;letter-spacing:.04em;color:var(--oro)}
.redondo{width:42px;height:42px;border-radius:50%;background:var(--panel);border:1px solid var(--borde);
  display:grid;place-items:center;color:var(--tinta)}
.redondo svg{width:22px;height:22px}
.con{position:relative;z-index:30}
.menu{position:absolute;top:50px;min-width:178px;background:var(--panel);border:1px solid var(--borde);border-radius:14px;
  padding:6px;box-shadow:0 14px 34px rgba(0,0,0,.45);display:none}
.menu.abierto{display:block}
.con.izq .menu{left:0}.con.der .menu{right:0}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:10px;font-size:16px;text-align:left}
.menu button.activo{background:var(--panel2);color:var(--oro);font-weight:600}
.menu button svg{width:20px;height:20px;flex:none}

/* Modos */
.modos{flex:none;display:flex;gap:6px;margin-top:8px;padding:4px;background:var(--panel);border:1px solid var(--borde);border-radius:14px}
.modos button{flex:1;height:38px;border-radius:10px;font:400 19px/1 'IM Fell English SC',Georgia,serif;letter-spacing:.03em;color:var(--tenue)}
.modos button.activo{background:var(--oro);color:var(--sobreOro)}

/* Resultado */
#res{flex:none;height:78px;margin-top:8px;display:flex;align-items:center;gap:14px;padding:0 4px}
#resNum{min-width:92px;text-align:center;font:700 54px/1 'Cinzel',Georgia,serif;color:var(--tinta);font-variant-numeric:lining-nums}
#resNum.larga{font-size:44px}
#resTxt{flex:1;min-width:0}
#resNivel{font:400 26px/1.05 'IM Fell English SC',Georgia,serif;letter-spacing:.02em}
#resDet{margin-top:5px;font-size:14px;line-height:1.25;color:var(--tenue);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#res.pista #resNum{display:none}
#res.pista #resNivel{font-size:21px;color:var(--tenue)}
#res[data-n="critico"] #resNivel,#res[data-n="critico"] #resNum{color:var(--critico)}
#res[data-n="especial"] #resNivel,#res[data-n="especial"] #resNum{color:var(--especial)}
#res[data-n="exito"] #resNivel,#res[data-n="exito"] #resNum{color:var(--exito)}
#res[data-n="fallo"] #resNivel,#res[data-n="fallo"] #resNum{color:var(--fallo)}
#res[data-n="pifia"] #resNivel,#res[data-n="pifia"] #resNum{color:var(--pifia)}
#res.entra #resNum,#res.entra #resNivel{animation:entra .32s cubic-bezier(.2,1.5,.4,1)}
@keyframes entra{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

/* Bandeja */
#marco{flex:1;min-height:150px;margin-top:6px;padding:9px;border-radius:22px;
  background:linear-gradient(145deg,var(--marco),var(--marco2));box-shadow:0 8px 22px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12)}
#bandeja{position:relative;width:100%;height:100%;border-radius:14px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 35%,var(--tapete1),var(--tapete2));
  box-shadow:inset 0 0 26px rgba(0,0,0,.6), inset 0 0 0 1px rgba(0,0,0,.5)}
#bandeja canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* Panel */
#panel{flex:none;margin-top:10px}
.fila{display:flex;align-items:center;gap:8px}
.etq{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--tenue)}
.paso{height:46px;min-width:46px;padding:0 10px;border-radius:12px;background:var(--panel);border:1px solid var(--borde);
  font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.paso:active,.dado:active,.redondo:active{transform:scale(.95)}
#hab{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid var(--oro2);background:var(--panel2);color:var(--tinta);
  text-align:center;font:700 26px/1 'Cinzel',Georgia,serif;-webkit-user-select:text;user-select:text;-moz-appearance:textfield;appearance:textfield}
#hab::-webkit-outer-spin-button,#hab::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.dados{display:flex;gap:6px}
.dado{position:relative;flex:1;height:46px;border-radius:12px;background:var(--panel);border:1px solid var(--borde);
  font-weight:700;font-size:14px;letter-spacing:-.01em}
.dado i{position:absolute;left:8px;right:8px;bottom:5px;height:4px;border-radius:2px;background:var(--c)}
.dado span{display:block;margin-top:-6px}
.dado b{position:absolute;top:-7px;right:-5px;min-width:21px;height:21px;padding:0 5px;border-radius:11px;
  background:var(--oro);color:var(--sobreOro);font-size:13px;line-height:21px;display:none}
.dado.con b{display:block}
.dado.con{border-color:var(--oro2);background:var(--panel2)}
#modVal{min-width:54px;text-align:center;font:700 22px/1 'Cinzel',Georgia,serif}
.hueco{flex:1}
.gordo{width:100%;height:58px;margin-top:10px;border-radius:16px;
  background:linear-gradient(180deg,var(--oro),var(--oro2));color:var(--sobreOro);
  font:700 22px/1 'Cinzel',Georgia,serif;letter-spacing:.08em;text-transform:uppercase;
  box-shadow:0 5px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35)}
.gordo:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.gordo[disabled]{opacity:.55}
[hidden]{display:none!important}

footer{flex:none;display:flex;align-items:center;justify-content:space-between;margin-top:8px;height:34px;font-size:14px;color:var(--tenue)}
footer button{display:flex;align-items:center;gap:6px;height:34px;padding:0 6px}
footer svg{width:18px;height:18px}

/* Ventanas */
#velo{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
#velo.abierto{display:flex}
#hoja{width:100%;max-width:520px;max-height:78%;display:flex;flex-direction:column;background:var(--panel);
  border-radius:22px 22px 0 0;border:1px solid var(--borde);border-bottom:0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));
  animation:sube .25s ease-out}
@keyframes sube{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#hojaT{margin:0 0 10px;font:400 26px/1 'IM Fell English SC',Georgia,serif;color:var(--oro);text-align:center}
#hojaC{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;font-size:16px;line-height:1.5}
#hojaC p{margin:0 0 10px;-webkit-user-select:text;user-select:text}
.tir{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--borde)}
.tir .n{min-width:58px;text-align:center;font:700 26px/1 'Cinzel',Georgia,serif}
.tir .d{flex:1;min-width:0;font-size:15px;line-height:1.3}
.tir .d small{display:block;color:var(--tenue);font-size:13px}
.tir[data-n="critico"] .n{color:var(--critico)}.tir[data-n="especial"] .n{color:var(--especial)}
.tir[data-n="exito"] .n{color:var(--exito)}.tir[data-n="fallo"] .n{color:var(--fallo)}.tir[data-n="pifia"] .n{color:var(--pifia)}
.hojaB{display:flex;gap:8px;margin-top:12px}
.hojaB button{flex:1;height:48px;border-radius:13px;background:var(--panel2);border:1px solid var(--borde);font-size:16px;font-weight:600}
.hojaB button.pral{background:var(--oro);color:var(--sobreOro);border-color:transparent}

#aviso{position:fixed;left:50%;bottom:120px;transform:translate(-50%,20px);z-index:60;background:var(--tinta);color:var(--fondo);
  padding:10px 16px;border-radius:999px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:.25s}
#aviso.ver{opacity:1;transform:translate(-50%,0)}

#gira{position:fixed;inset:0;z-index:90;background:var(--fondo);display:none;place-items:center;
  font:400 28px/1 'IM Fell English SC',Georgia,serif;color:var(--oro)}
@media (orientation:landscape) and (max-height:520px){#gira{display:grid}}
@media (max-height:640px){#res{height:62px}#resNum{font-size:44px}.gordo{height:52px}}
@media (prefers-reduced-motion:reduce){#res.entra #resNum,#res.entra #resNivel,#hoja{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="con izq">
      <button class="redondo" id="btnIdioma" aria-label="Idioma">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.4 4 5.6 4 9s-1.4 6.600-4 9c-2.6-2.4-4-5.600-4-9s1.400-6.600 4-9z"/></svg>
      </button>
      <div class="menu" id="menuIdioma"></div>
    </div>
    <h1 aria-label="DiceTech">DiceTech</h1>
    <div class="con der">
      <button class="redondo" id="btnTema" aria-label="Tema"></button>
      <div class="menu" id="menuTema"></div>
    </div>
  </header>

  <nav class="modos">
    <button data-modo="cth" id="tabCth"></button>
    <button data-modo="libre" id="tabLibre"></button>
  </nav>

  <section id="res" class="pista" aria-live="polite">
    <div id="resNum"></div>
    <div id="resTxt"><div id="resNivel"></div><div id="resDet"></div></div>
  </section>

  <div id="marco"><div id="bandeja"><canvas id="lienzo"></canvas></div></div>

  <section id="panel">
    <div id="panelCth">
      <div class="fila">
        <button class="paso" data-hab="-10">−10</button>
        <button class="paso" data-hab="-1">−1</button>
        <input id="hab" type="number" inputmode="numeric" min="1" max="99" aria-label="Habilidad">
        <button class="paso" data-hab="1">+1</button>
        <button class="paso" data-hab="10">+10</button>
      </div>
    </div>
    <div id="panelLibre" hidden>
      <div class="dados" id="dados"></div>
      <div class="fila" style="margin-top:10px">
        <span class="etq" id="etqMod"></span>
        <span class="hueco"></span>
        <button class="paso" data-mod="-1">−</button>
        <span id="modVal">+0</span>
        <button class="paso" data-mod="1">+</button>
        <button class="paso" id="btnVaciar"></button>
      </div>
    </div>
    <button class="gordo" id="btnTirar"></button>
  </section>

  <footer>
    <button id="btnHist">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.700"/><path d="M3 4v5h5M12 7.500V12l3 2"/></svg>
      <span id="txtHist"></span>
    </button>
    <button id="btnSonido" aria-label="Sonido"></button>
    <button id="btnLegal"></button>
  </footer>
</div>

<div id="velo"><div id="hoja"><h2 id="hojaT"></h2><div id="hojaC"></div><div class="hojaB" id="hojaB"></div></div></div>
<div id="aviso"></div>
<div id="gira"></div>

<script type="module" src="app.js"></script>
</body>
</html>
